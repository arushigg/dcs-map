name: Update map

on:
  schedule:
    - cron: "7 * * * *"      # every hour, at 7 minutes past
  workflow_dispatch:         # lets you refresh by hand: Actions tab > Update map > Run workflow
  push:
    branches: [main]         # also rebuilds whenever you change a file here

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build the map from the Google Sheet
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: python build_map.py

      - name: Password-protect the page
        working-directory: site
        env:
          STATICRYPT_PASSWORD: ${{ secrets.MAP_PASSWORD }}
          # Fixed salt so people who tick "Remember me" are not logged out at every hourly rebuild.
          # The salt is not a secret.
          SALT: "0ba76df21d4a445c16779b9c41d6cf1a"
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then echo "The MAP_PASSWORD secret is not set"; exit 1; fi
          npx --yes staticrypt@3.5.4 index.html --config false --short --remember 30 --salt "$SALT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/encrypted     # only the encrypted page is published

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
